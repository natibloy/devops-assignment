# The builder is provisioned before any Salt master exists and is destroyed once
# its artifacts are exported, so it runs masterless against the same state tree
# (mounted from the host) that the master serves to the other nodes.
id: builder
file_client: local

file_roots:
  base:
    - /srv/salt

pillar_roots:
  base:
    - /srv/pillar

grains:
  role: builder

log_level: info
