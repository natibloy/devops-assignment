interface: 0.0.0.0

# The compute minion's key is trusted on first contact so `vagrant up` needs no
# manual `salt-key -A` step.
auto_accept: True

file_roots:
  base:
    - /srv/salt
    # The Helm chart lives at charts/ in the repo, per Helm convention, so it is
    # served as a second root rather than moved into the state tree. This is what
    # lets the compute node fetch it from the master instead of reading it off a
    # Vagrant synced folder.
    - /srv/charts

pillar_roots:
  base:
    - /srv/pillar

log_level: info
