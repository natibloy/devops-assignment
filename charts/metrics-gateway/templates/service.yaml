apiVersion: v1
kind: Service
metadata:
  name: {{ include "metrics-gateway.fullname" . }}
  labels:
    {{- include "metrics-gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if eq .Values.service.type "NodePort" }}
      # Fixed so the Slurm job on the controller can reach the gateway at a
      # predictable address on the private network.
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "metrics-gateway.selectorLabels" . | nindent 4 }}
