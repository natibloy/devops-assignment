replicaCount: 1

image:
  repository: localhost/metrics-gateway
  tag: "0.2.0"
  # The image is side-loaded into containerd from the builder's export, so pulling
  # must never be attempted.
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8080
  nodePort: 30080

serviceMonitor:
  enabled: true
  interval: 15s
  # Prometheus selects ServiceMonitors carrying its own release label. Salt
  # overrides this with the release name from its pillar, which owns it; the value
  # here is only a standalone-install default.
  labels:
    release: kps

dashboard:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
